name: "Efso Radar — Admin Health Report (ADMIN)"

# AUTOMATION READINESS CONTRACT:
# Operational Schedule: 1 run per day: 22:00 Europe/Istanbul (UTC+3)
# Corresponding UTC Cron: 0 19 * * *
# NOTE: Active cron schedule is intentionally DISABLED during Phase 5B.3D offline readiness.
# Recipient Invariant: Dispatches exclusively to ADMIN (maximum 1 per Istanbul calendar day).
# PRIMARY_EDITOR never receives admin operational reports.
# Live cloud activation requires separate, explicit Product Owner authorization.

on:
  # schedule:
  #   - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      timestamp:
        description: "ISO-8601 UTC evaluation timestamp (default: representative eligible slot 19:00 UTC / 22:00 TSİ)"
        required: false
        default: "2026-10-24T19:00:00Z"
      preview_mode:
        description: "Run safe offline execution preview (zero network, synthetic data)"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: efso-radar-admin-report
  cancel-in-progress: false

jobs:
  admin_report_preview:
    name: "Offline Admin Health Report Preview"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Offline Admin Health Report Preview (Hermetic Synthetic Data Only)
        env:
          PYTHONPATH: src
        run: |
          python -m efso_radar.workflow --task admin-health-report --preview --timestamp "${{ inputs.timestamp || '2026-10-24T19:00:00Z' }}"

