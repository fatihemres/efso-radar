name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite with pytest
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests -v

  # Baseline fatal static checks only; broad style/typecheck/coverage roll out separately.
  static-safety:
    name: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.13.3
      - name: Check syntax and high-confidence Pyflakes errors
        run: ruff check --target-version py311 --select E9,F63,F7,F82 src scripts tests

  # Independent hosted Windows validation, not a test on the PO's own computer.
  windows-smoke:
    name: windows-smoke (3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run hermetic tests on hosted Windows
        env:
          PYTHONPATH: src
        run: python -m pytest tests -v
