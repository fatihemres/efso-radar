name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Update vulnerable runner build tooling
        run: python -m pip install setuptools==84.2.1

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Scan installed dependencies for published advisories
        run: python -m pip_audit --local --strict --progress-spinner off --vulnerability-service pypi --timeout 15

      - name: Run test suite with pytest
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests -v

