name: "Efso Radar — RSS Discovery (SCAN_ONLY)"

# AUTOMATION READINESS CONTRACT:
# Operational Schedule: 8 runs per day: 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17 Europe/Istanbul (UTC+3)
# Corresponding UTC Cron: 17 0,3,6,9,12,15,18,21 * * *
# NOTE: Active cron schedule is intentionally DISABLED during Phase 5B.3D offline readiness.
# Live cloud activation requires separate, explicit Product Owner authorization.

on:
  # schedule:
  #   - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      timestamp:
        description: "ISO-8601 UTC evaluation timestamp (default: representative eligible slot 06:17 UTC / 09:17 TSİ)"
        required: false
        default: "2026-10-24T06:17:00Z"
      preview_mode:
        description: "Run safe offline execution preview (zero network, synthetic data)"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: efso-radar-scan
  cancel-in-progress: false

jobs:
  scan_preview:
    name: "Offline Scan Preview"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Execute Offline Scan Preview (Hermetic Synthetic Data Only)
        env:
          PYTHONPATH: src
        run: |
          python -m efso_radar.workflow --task scan-only --preview --timestamp "${{ inputs.timestamp || '2026-10-24T06:17:00Z' }}"

